# config/services.yaml
services:
    _defaults:
        autowire: true          # Automatically injects dependencies in your services.
        autoconfigure: true     # Automatically registers your services as commands, event subscribers, etc.
        public: false           # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work.
        # The best practice is to be explicit about your dependencies anyway.

    Diversworld\ContaoDiveclubBundle\:
        resource: ../src/
        exclude: ../src/{DependencyInjection,Model,Session,NotificationType,Controller/Backend/TankCheckPdfController.php}

    diversworld.template.helper:
        alias: Diversworld\ContaoDiveclubBundle\Helper\DcaTemplateHelper
        public: true

    Diversworld\ContaoDiveclubBundle\Helper\DcaTemplateHelper:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $scopeMatcher: '@contao.routing.scope_matcher'
            $requestStack: '@request_stack'

    # Make the FQCN service explicitly public to allow fetching via container by class name
    Diversworld\ContaoDiveclubBundle\Helper\CourseProgressHelper:
        public: true

    Diversworld\ContaoDiveclubBundle\Controller\Backend\TankCheckPdfController:
        public: true
        autowire: true
        tags: ['controller.service_arguments']

    Diversworld\ContaoDiveclubBundle\EventListener\DataContainer\CourseListener:
        arguments:
            $notificationCenter: '@?terminal42_notification_center'

    Diversworld\ContaoDiveclubBundle\Migration\CopyFilesMigration:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $webDir: '%contao.web_dir%'

    Diversworld\ContaoDiveclubBundle\Service\TankCheckPdfGenerator:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $insertTagParser: '@contao.insert_tag.parser'
            $requestStack: '@request_stack'

    # Add a session bag
    diversworld.contao_diveclub_bundle.session.factory:
        class: Diversworld\ContaoDiveclubBundle\Session\SessionFactory
        decorates: session.factory
        arguments:
            - '@diversworld.contao_diveclub_bundle.session.factory.inner'
            - '@diversworld.contao_diveclub_bundle.session.attribute.array_attribute_bag'

    diversworld.contao_diveclub_bundle.session.attribute.array_attribute_bag:
        class: Diversworld\ContaoDiveclubBundle\Session\Attribute\ArrayAttributeBag
        arguments:
            - '_diversworld_reservation_temp' # Attributname (KEY)
            - _diversworld_contao_diveclub_attributes
        calls:
            - [ setName, [ diversworld_contao_diveclub ] ]
